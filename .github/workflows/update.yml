name: Daily Major Indices Auto Update & GitHub Pages Deploy

on:
  schedule:
    # 1. 台股週一至週五收盤後自動執行：UTC 06:35 (台灣時間週一至週五下午 14:35)
    - cron: '35 6 * * 1-5'
    # 2. 美股週一至週五收盤後自動執行：UTC 21:30 (台灣時間週二至週六清晨 05:30)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-all-indices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run All 4 Indices (TAIEX / DJI / NASDAQ / SOX) Calculation & Portal Builder
        run: |
          python update_all_indices.py

      - name: Send Daily Email Report (Optional if Secrets Configured)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python send_email_report.py

      - name: Commit and Push Updated CSVs & HTML to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html 各大指數高低控統整_多週期與跨週期前瞻雙軌通道分析系統.html
          git commit -m "Auto update TAIEX/DJI/NASDAQ/SOX data: $(date '+%Y-%m-%d %H:%M')" || exit 0
          git pull --rebase origin main || true
          git push origin main || true
